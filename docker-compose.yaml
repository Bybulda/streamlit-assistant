version: '3.9'

services:
  db:
    image: postgres:15
    container_name: streamlit_backend_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamlit_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb_service
    restart: always
    ports:
      - "8001:8000"
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamlit_backend
    restart: always
    depends_on:
      - db
      - chromadb
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/streamlit_backend
      - CHROMA_URL=http://chromadb:8000
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: streamlit_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./streamlit:/app

volumes:
  postgres_data:
  chroma_data:
